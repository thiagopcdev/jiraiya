appId: br.com.biud.jiraiya
productName: Jiraiya
copyright: © Thiago Carvalho (@thiagopcdev)
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json,vitest.config.ts}'
  - '!**/*.test.ts'
asarUnpack:
  - resources/**
mac:
  target:
    - target: dmg
      arch: arm64
    - target: zip
      arch: arm64
  entitlementsInherit: build/entitlements.mac.plist
  # exigidos pela notarização; sem certificado no keychain o electron-builder
  # pula a assinatura e o afterSign entra com ad-hoc completo (scripts/after-sign-mac.cjs)
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  gatekeeperAssess: false
  # ligado por CLI quando as credenciais existem: npm run build:mac:notarized
  notarize: false
afterSign: scripts/after-sign-mac.cjs
dmg:
  artifactName: ${name}-${version}.${ext}
win:
  target:
    - target: nsis
      arch: x64
  icon: build/icon.ico
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
# better-sqlite3 é rebuildado pelo postinstall (install-app-deps)
npmRebuild: false
