name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # postinstall roda electron-builder install-app-deps, que resolve o
      # binário nativo do better-sqlite3 para win32-x64
      - run: npm ci

      # --publish never: em CI com tag o electron-builder tenta publicar a
      # release ele mesmo e exige GH_TOKEN; quem publica é o action-gh-release
      - run: npm run build:win -- --publish never

      - name: Publicar instalador na release (push de tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*-setup.exe

      - name: Upload do instalador como artifact (execução manual)
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: jiraiya-windows-setup
          path: dist/*-setup.exe

  macos:
    # macos-latest é arm64 (Apple Silicon) — casa com o target arm64 do electron-builder.yml.
    # needs: o job windows (fluxo validado) CRIA a release; este só anexa —
    # evita a corrida de dois action-gh-release criando a mesma release em paralelo
    needs: windows
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # A escolha é em shell porque secret não pode ser lido em `if:` de step.
      # Os nomes CSC_* só entram no ambiente DENTRO do ramo com certificado:
      # secret ausente vira string vazia, e CSC_LINK definido (ainda que vazio)
      # faz o electron-builder procurar um arquivo de certificado e abortar
      # com "not a file" — foi assim que a v3.2.1 falhou na primeira tentativa.
      - name: Build do DMG (assina e notariza quando há credenciais)
        env:
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$MAC_CERT_P12_BASE64" ] && [ -n "$APPLE_ID" ]; then
            echo "credenciais presentes: assinando com Developer ID e notarizando"
            export CSC_LINK="$MAC_CERT_P12_BASE64"
            export CSC_KEY_PASSWORD="$MAC_CERT_PASSWORD"
            npm run build:mac:notarized -- --publish never
          else
            echo "sem credenciais Apple: DMG sai com assinatura ad-hoc (exige botão direito → Abrir)"
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            npm run build:mac -- --publish never
          fi

      - name: Publicar DMG na release (push de tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg

      - name: Upload do DMG como artifact (execução manual)
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: jiraiya-macos-dmg
          path: dist/*.dmg
