# Validação de PR: typecheck + lint + testes com gate de cobertura (thresholds
# no vitest.config.ts — statements/functions/lines ≥85%, branches ≥78%).
name: CI

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # postinstall compila o better-sqlite3 para a ABI do Electron (os testes
      # rodam via ELECTRON_RUN_AS_NODE — não precisa de display)
      - name: Instalar dependências
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Testes + cobertura (gate 85%)
        run: npm run test:coverage

      - name: Resumo da cobertura no job
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node -e "const t=require('./coverage/coverage-summary.json').total; console.log(\`Statements: \${t.statements.pct}% | Branches: \${t.branches.pct}% | Functions: \${t.functions.pct}% | Lines: \${t.lines.pct}%\`)" >> "$GITHUB_STEP_SUMMARY"
          fi
